<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flash Home - ระบบจัดการสต็อก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"IBM Plex Sans Thai"', 'sans-serif'] },
                    colors: {
                        flash: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 500: '#f59e0b', 600: '#d97706', 700: '#b45309', 800: '#92400e' }
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 4px; height: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9999px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @media (min-width: 768px) { .modal-enter { animation: popIn 0.2s ease-out forwards; } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        @keyframes toastIn { from { transform: translateX(110%) scale(0.92); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes toastOut { from { transform: translateX(0) scale(1); opacity: 1; } to { transform: translateX(110%) scale(0.92); opacity: 0; } }
        .toast-enter { animation: toastIn 0.28s cubic-bezier(.22,.61,.36,1) forwards; }
        .toast-exit { animation: toastOut 0.22s cubic-bezier(.4,0,1,1) forwards; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Smooth active state feedback */
        .active\:scale-95:active, .active\:scale-\[0\.98\]:active, .active\:scale-\[0\.97\]:active { transition: transform 0.08s ease; }

        /* Modal container - bottom sheet on mobile, centered on desktop */
        @media (max-width: 767px) {
            #modal-content { border-radius: 1.25rem 1.25rem 0 0 !important; }
        }

        .drag-over { outline: 2px dashed #f59e0b; background-color: #fffbeb; }

        #save-indicator { transition: opacity 0.3s, transform 0.3s cubic-bezier(.4,0,.2,1); }

        #print-area { display: none; }
        @media print {
            body { background-color: white !important; margin: 0; padding: 0; }
            #app-container, #modal-container, #toast-container, #confirm-container, #loading-screen { display: none !important; }
            #print-area {
                display: block !important;
                margin: 0 auto;
                background: white;
                color: black;
                font-family: 'IBM Plex Sans Thai', sans-serif;
            }
            #print-area.receipt-mode {
                width: 100%;
                max-width: 300px;
                padding: 10px;
            }
            #print-area.report-mode {
                width: 100%;
                max-width: 100%;
                padding: 20px;
            }
            #print-area.invoice-mode {
                width: 100%;
                max-width: 210mm; /* A4 width */
                padding: 20mm;
                font-family: 'Sarabun', 'IBM Plex Sans Thai', sans-serif;
            }
            @page { margin: 0.5cm; }
        }
    </style>
</head>
<body class="text-gray-800 md:bg-gray-50 h-screen overflow-hidden">

    <div id="loading-screen" class="fixed inset-0 bg-white z-[80] flex flex-col items-center justify-center gap-3 px-8">
        <i id="ls-icon" class="ph ph-spinner-gap animate-spin text-amber-500 text-5xl"></i>
        <p id="ls-title" class="text-gray-800 font-bold text-lg font-sans">กำลังเตรียมระบบ</p>
        <p id="ls-step" class="text-gray-400 text-sm font-sans">กำลังเริ่มต้น...</p>
        <div id="ls-error" class="hidden flex-col items-center gap-3 mt-2 w-full max-w-xs">
            <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-sm text-red-700 text-center font-medium w-full" id="ls-error-msg">เกิดข้อผิดพลาด</div>
            <button onclick="location.reload()" class="w-full bg-amber-500 text-white font-bold py-3 rounded-xl text-base shadow active:scale-95 transition-transform">
                🔄 ลองใหม่อีกครั้ง
            </button>
            <p class="text-xs text-gray-400 text-center">ตรวจสอบว่าเชื่อมต่ออินเทอร์เน็ตอยู่</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Save indicator -->
    <div id="save-indicator" class="fixed bottom-20 md:bottom-4 left-1/2 -translate-x-1/2 z-[99] opacity-0 pointer-events-none transform translate-y-[-4px]">
        <div class="bg-gray-800 text-white text-xs font-bold px-4 py-2 rounded-full flex items-center gap-2 shadow-lg">
            <i class="ph ph-floppy-disk animate-pulse"></i> กำลังบันทึก...
        </div>
    </div>

    <!-- Custom Confirm -->
    <div id="confirm-container" class="fixed inset-0 z-[90] hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onclick="if(event.target===this)window.closeConfirm(false)">
        <div id="confirm-box" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 opacity-0 transition-all duration-200">
            <div class="p-6 text-center">
                <div id="confirm-icon" class="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="ph ph-warning-circle text-4xl"></i>
                </div>
                <h3 id="confirm-title" class="text-lg font-bold text-gray-800 mb-1">ยืนยัน</h3>
                <p id="confirm-message" class="text-sm text-gray-500 mb-5 leading-relaxed">คุณแน่ใจหรือไม่?</p>
                <div class="flex gap-3">
                    <button onclick="window.closeConfirm(false)" class="flex-1 py-3 px-4 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition-colors text-sm">← ไม่ใช่</button>
                    <button id="confirm-btn-yes" class="flex-1 py-3 px-4 bg-flash-500 text-white rounded-xl font-bold hover:bg-flash-600 transition-colors shadow-md text-sm">ยืนยัน →</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app-container" class="md:flex md:h-screen w-full">
        <!-- SIDEBAR (Desktop) -->
        <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 z-50 shadow-sm flex-shrink-0">
            <div class="p-4 bg-gradient-to-r from-flash-500 to-flash-600 text-white h-16 flex items-center justify-center">
                <div class="flex items-center gap-3">
                    <div class="bg-white text-flash-600 rounded-lg w-8 h-8 flex items-center justify-center font-bold text-lg shadow-sm">FH</div>
                    <h1 class="font-bold text-lg leading-tight">Flash Home</h1>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2 ml-2">เมนูหลัก</p>
                <button onclick="window.navigate('stock')" data-tab="stock" class="nav-item desktop-nav w-full flex items-center gap-3 px-4 py-3 rounded-xl text-flash-600 bg-flash-50 transition-all font-medium text-sm">
                    <i class="ph ph-package text-xl"></i> สต็อกสินค้า
                </button>
                <button onclick="window.navigate('sell')" data-tab="sell" class="nav-item desktop-nav w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-flash-50 hover:text-flash-600 transition-all font-medium text-sm">
                    <i class="ph ph-shopping-cart text-xl"></i> ขายสินค้า (POS)
                </button>
                <button onclick="window.navigate('transfer')" data-tab="transfer" class="nav-item desktop-nav w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-flash-50 hover:text-flash-600 transition-all font-medium text-sm">
                    <i class="ph ph-arrows-down-up text-xl"></i> โอนย้ายสต็อก
                </button>
                <button onclick="window.navigate('parcels')" data-tab="parcels" class="nav-item desktop-nav w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-flash-50 hover:text-flash-600 transition-all font-medium text-sm">
                    <i class="ph ph-truck text-xl"></i> ยอดพัสดุรับเข้า
                </button>
                
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2 ml-2 mt-6">ระบบจัดการ</p>
                <button onclick="window.navigate('history')" data-tab="history" class="nav-item desktop-nav w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-flash-50 hover:text-flash-600 transition-all font-medium text-sm">
                    <i class="ph ph-chart-line-up text-xl"></i> สรุปยอดขาย / ประวัติ
                </button>
                <button onclick="window.navigate('manage')" data-tab="manage" class="nav-item desktop-nav w-full flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-flash-50 hover:text-flash-600 transition-all font-medium text-sm">
                    <i class="ph ph-gear text-xl"></i> จัดการสินค้า
                </button>
            </div>
            <div class="p-4 border-t border-gray-100">
                <p class="text-xs text-green-600 font-bold flex items-center justify-center gap-1 bg-green-50 px-3 py-2 rounded-lg border border-green-200">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> ออนไลน์ (Firebase)
                </p>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50 md:bg-gray-100">
            <!-- Mobile Header -->
            <header class="md:hidden bg-gradient-to-r from-flash-500 to-flash-600 text-white p-4 sticky top-0 z-40 shadow-md flex-shrink-0">
                <div class="flex justify-between items-center max-w-lg mx-auto">
                    <div class="flex items-center gap-3">
                        <div class="bg-white text-flash-600 rounded-lg w-10 h-10 flex items-center justify-center font-bold text-xl shadow-sm">FH</div>
                        <div>
                            <h1 class="font-bold text-lg leading-tight">Flash Home</h1>
                            <p class="text-xs text-flash-100 flex items-center gap-1">
                                <span class="w-2 h-2 rounded-full bg-green-300 animate-pulse"></span> ออนไลน์ (Firebase)
                            </p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Desktop Status Bar -->
            <div class="hidden md:flex justify-between items-center p-4 lg:px-8 bg-white border-b border-gray-200 shadow-sm z-30 flex-shrink-0">
                <h2 class="font-bold text-xl text-gray-800" id="desktop-page-title">📦 สต็อกสินค้า</h2>
                <div class="flex items-center gap-4">
                    <div class="text-sm text-gray-500 font-medium" id="desktop-date-time"></div>
                </div>
            </div>

            <!-- Content Area -->
            <main id="app-content" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 pb-32 md:pb-8 w-full max-w-lg md:max-w-7xl mx-auto"></main>
        </div>

        <!-- BOTTOM NAV (Mobile) -->
        <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-gray-200 z-40 pb-safe">
            <div class="flex justify-around items-center w-full h-16 px-1">
                <button onclick="window.navigate('stock')" data-tab="stock" class="nav-item mobile-nav flex flex-col items-center justify-center flex-1 text-flash-600 transition-colors">
                    <i class="ph ph-package text-2xl mb-0.5"></i>
                    <span class="text-[9px] font-bold">สต็อก</span>
                </button>
                <button onclick="window.navigate('sell')" data-tab="sell" class="nav-item mobile-nav flex flex-col items-center justify-center flex-1 text-gray-500 transition-colors">
                    <div class="relative">
                        <i class="ph ph-shopping-cart text-2xl mb-0.5"></i>
                        <span id="cart-badge" class="hidden absolute -top-1.5 -right-2.5 bg-green-500 text-white text-[9px] font-black w-5 h-5 rounded-full shadow flex items-center justify-center border-2 border-white">0</span>
                    </div>
                    <span class="text-[9px] font-bold">ขาย</span>
                </button>
                <button onclick="window.navigate('transfer')" data-tab="transfer" class="nav-item mobile-nav flex flex-col items-center justify-center flex-1 text-gray-500 transition-colors">
                    <i class="ph ph-arrows-down-up text-2xl mb-0.5"></i>
                    <span class="text-[9px] font-bold">โอนย้าย</span>
                </button>
                <button onclick="window.navigate('parcels')" data-tab="parcels" class="nav-item mobile-nav flex flex-col items-center justify-center flex-1 text-gray-500 transition-colors">
                    <i class="ph ph-truck text-2xl mb-0.5"></i>
                    <span class="text-[9px] font-bold">พัสดุ</span>
                </button>
                <button onclick="window.navigate('history')" data-tab="history" class="nav-item mobile-nav flex flex-col items-center justify-center flex-1 text-gray-500 transition-colors">
                    <i class="ph ph-chart-line-up text-2xl mb-0.5"></i>
                    <span class="text-[9px] font-bold">ยอดขาย</span>
                </button>
                <button onclick="window.navigate('manage')" data-tab="manage" class="nav-item mobile-nav flex flex-col items-center justify-center flex-1 text-gray-500 transition-colors">
                    <i class="ph ph-gear text-2xl mb-0.5"></i>
                    <span class="text-[9px] font-bold">จัดการ</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Global Modal -->
    <div id="modal-container" class="fixed inset-0 bg-black/60 z-50 hidden flex-col justify-end md:justify-center md:items-center">
        <div id="modal-content" class="bg-white w-full max-w-lg mx-auto rounded-t-2xl md:rounded-2xl p-5 modal-enter max-h-[90vh] overflow-y-auto shadow-2xl relative" style="transition: transform 0.18s cubic-bezier(.4,0,.2,1), opacity 0.18s ease; transform: translateY(24px); opacity: 0;">
        </div>
    </div>

    <div id="print-area"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let firebaseConfig = {
        apiKey: "AIzaSyDk00q2_fq5iMnuScR6V4FJHiPn1UFQ6CE",
        authDomain: "database-flash-home.firebaseapp.com",
        projectId: "database-flash-home",
        storageBucket: "database-flash-home.firebasestorage.app",
        messagingSenderId: "82352098716",
        appId: "1:82352098716:web:77abcfd308cf4892274c59",
        measurementId: "G-R3CDBRSXWN"
    };

    if (typeof __firebase_config !== 'undefined') firebaseConfig = JSON.parse(__firebase_config);

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'flash-home-stock';

    let currentUser = null;
    let products = [];
    let historyLogs = [];
    let parcelLogs = [];

    let cart = [];
    let cartDiscount = 0;
    let cartShipping = 0;
    
    // Fallback safe JSON parsing for local storage
    try {
        cart = JSON.parse(localStorage.getItem('flash_pos_cart')) || [];
        cartDiscount = parseFloat(localStorage.getItem('flash_pos_discount')) || 0;
        cartShipping = parseFloat(localStorage.getItem('flash_pos_shipping')) || 0;
        window.cartNote = localStorage.getItem('flash_pos_note') || '';
    } catch(e) {
        cart = [];
        window.cartNote = '';
        console.error("Local storage error", e);
    }
    window.cartPaymentMethod = 'cash'; 

    let transferCart = [];

    let currentTab = 'stock';
    let currentFilter = 'ทั้งหมด';
    let isQuickEditMode = false;
    window.currentSearchQuery = '';
    window.historySubTab = 'report';
    window.sellViewMode = 'grid';  
    window.sellSortMode = 'default'; 
    
    window.recentlySoldIds = [];
    try {
        window.recentlySoldIds = JSON.parse(localStorage.getItem('flash_recent_sold') || '[]');
    } catch(e) {}

    const getLocalYMD = (d) => {
        const date = new Date(d);
        if (isNaN(date.getTime())) return new Date().toISOString().split('T')[0];
        return `${date.getFullYear()}-${(date.getMonth()+1).toString().padStart(2,'0')}-${date.getDate().toString().padStart(2,'0')}`;
    };

    window.reportStartDate = getLocalYMD(new Date());
    window.reportEndDate = getLocalYMD(new Date());

    window.parcelInputDate = getLocalYMD(new Date());
    window.parcelMonthFilter = window.parcelInputDate.substring(0, 7); 

    const categoryList = ['กล่อง', 'ซอง', 'บับเบิ้ล', 'เทป', 'อื่นๆ'];
    const couriersList = [
        { id: 'kerry', name: 'Kerry', color: 'bg-orange-50 text-orange-600 border-orange-200', icon: 'ph-truck' },
        { id: 'flash', name: 'Flash', color: 'bg-yellow-50 text-yellow-600 border-yellow-200', icon: 'ph-lightning' },
        { id: 'post', name: 'ไปรษณีย์ไทย', color: 'bg-red-50 text-red-600 border-red-200', icon: 'ph-envelope' },
        { id: 'shopee', name: 'Shopee', color: 'bg-orange-50 text-orange-500 border-orange-200', icon: 'ph-shopping-bag' },
        { id: 'lazada', name: 'Lazada', color: 'bg-blue-50 text-blue-600 border-blue-200', icon: 'ph-shopping-cart' },
        { id: 'lazflash', name: 'Lazada x Flash', color: 'bg-indigo-50 text-indigo-600 border-indigo-200', icon: 'ph-handshake' }
    ];

    window.formatMoney = (num) => Number(num).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    window.formatQty = (num) => Number(num).toLocaleString('th-TH');

    function showSaveIndicator() {
        const el = document.getElementById('save-indicator');
        if (el) { el.style.opacity = '1'; el.style.transform = 'translateY(0) translateX(-50%)'; }
    }
    function hideSaveIndicator() {
        const el = document.getElementById('save-indicator');
        if (el) { el.style.opacity = '0'; el.style.transform = 'translateY(-4px) translateX(-50%)'; }
    }

    window.showToast = function(message, type, options) {
        if (type === undefined) type = 'success';
        if (options === undefined) options = {};
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const colors = type === 'success' ? 'bg-gray-800 text-white' :
                       type === 'error' ? 'bg-red-600 text-white' :
                       type === 'warning' ? 'bg-amber-500 text-white' : 'bg-blue-600 text-white';
        const icon = type === 'success' ? 'ph-check-circle' :
                     type === 'error' ? 'ph-warning-circle' :
                     type === 'warning' ? 'ph-warning' : 'ph-info';
        const duration = options.duration || 3000;
        toast.className = `flex items-center gap-3 ${colors} pl-4 pr-3 py-3 rounded-2xl shadow-xl toast-enter pointer-events-auto max-w-xs`;
        
        let actionHtml = '';
        if (options.actionLabel && options.actionFn) {
            const actionId = 'ta_' + Date.now();
            window[actionId] = function() { options.actionFn(); dismissToast(); };
            actionHtml = `<button onclick="window['${actionId}']();" class="ml-1 bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-3 py-1.5 rounded-xl whitespace-nowrap transition-colors border border-white/20 active:scale-95">${options.actionLabel}</button>`;
        }
        
        toast.innerHTML = `<i class="ph ${icon} text-xl shrink-0"></i><span class="text-sm font-bold flex-1">${message}</span>${actionHtml}`;
        container.appendChild(toast);
        function dismissToast() {
            toast.classList.replace('toast-enter', 'toast-exit');
            setTimeout(function() { toast.remove(); }, 300);
        }
        setTimeout(dismissToast, duration);
    }

    let confirmCallback = null;
    window.showConfirm = function(title, message, iconType = 'warning', callback) {
        const container = document.getElementById('confirm-container');
        const box = document.getElementById('confirm-box');
        const iconDiv = document.getElementById('confirm-icon');

        document.getElementById('confirm-title').innerText = title;
        document.getElementById('confirm-message').innerHTML = message;

        if (iconType === 'danger') {
            iconDiv.className = 'w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4';
            iconDiv.innerHTML = '<i class="ph ph-trash text-4xl"></i>';
            document.getElementById('confirm-btn-yes').className = 'flex-1 py-3 px-4 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 transition-colors shadow-md text-sm';
        } else if (iconType === 'success') {
            iconDiv.className = 'w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4';
            iconDiv.innerHTML = '<i class="ph ph-check-circle text-4xl"></i>';
            document.getElementById('confirm-btn-yes').className = 'flex-1 py-3 px-4 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 transition-colors shadow-md text-sm';
        } else if (iconType === 'info') {
            iconDiv.className = 'w-16 h-16 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4';
            iconDiv.innerHTML = '<i class="ph ph-printer text-4xl"></i>';
            document.getElementById('confirm-btn-yes').className = 'flex-1 py-3 px-4 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600 transition-colors shadow-md text-sm';
        } else {
            iconDiv.className = 'w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4';
            iconDiv.innerHTML = '<i class="ph ph-warning-circle text-4xl"></i>';
            document.getElementById('confirm-btn-yes').className = 'flex-1 py-3 px-4 bg-amber-500 text-white rounded-xl font-bold hover:bg-amber-600 transition-colors shadow-md text-sm';
        }

        confirmCallback = callback;
        container.classList.remove('hidden');
        container.classList.add('flex');
        setTimeout(() => {
            box.classList.remove('scale-95', 'opacity-0');
            box.classList.add('scale-100', 'opacity-100');
        }, 10);
    }

    window.closeConfirm = function(isYes) {
        const container = document.getElementById('confirm-container');
        const box = document.getElementById('confirm-box');
        box.classList.remove('scale-100', 'opacity-100');
        box.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            container.classList.remove('flex');
            container.classList.add('hidden');
            if (isYes && confirmCallback) { confirmCallback(); }
            confirmCallback = null;
        }, 200);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {

            if (ctr && !ctr.classList.contains('hidden')) window.closeConfirm(false);
        }

    document.getElementById('confirm-btn-yes').addEventListener('click', () => window.closeConfirm(true));

    const modalContainer = document.getElementById('modal-container');
    const modalContent = document.getElementById('modal-content');

    function showModal(html) {

        modalContainer.classList.remove('hidden');
        modalContainer.classList.add('flex');

    window.hideModal = function() {
        modalContent.style.transform = 'translateY(24px)';

            modalContainer.classList.add('hidden');
            modalContainer.classList.remove('flex');

    document.addEventListener('wheel', function(e) {
        if (e.target.type === 'number') e.preventDefault();
    }, { passive: false });

    function setStep(msg) {
        const el = document.getElementById('ls-step');
        if (el) el.innerText = msg;
    }

    function setLoadingError(msg) {
        const icon = document.getElementById('ls-icon');
        const title = document.getElementById('ls-title');
        const errDiv = document.getElementById('ls-error');
        const errMsg = document.getElementById('ls-error-msg');
        if (icon) { icon.className = 'ph ph-warning-circle text-red-500 text-5xl'; }
        if (title) title.innerText = 'เชื่อมต่อไม่ได้';
        if (errMsg) errMsg.innerText = msg;
        if (errDiv) { errDiv.classList.remove('hidden'); errDiv.classList.add('flex'); }
    }

    function hideLoadingScreen() {
        clearTimeout(window._loadTimeout);
        const s = document.getElementById('loading-screen');
        if (s) s.style.display = 'none';
    }

    window.onerror = function(msg, src, line) { setLoadingError('JS Error: ' + msg + ' (line ' + line + ')'); };
    window.onunhandledrejection = function(e) { setLoadingError('Promise Error: ' + (e.reason?.message || e.reason || 'unknown')); };

    window._loadTimeout = setTimeout(() => {
        const s = document.getElementById('loading-screen');
        if (s && s.style.display !== 'none') {
            setLoadingError('หมดเวลาเชื่อมต่อ — Firebase ไม่ตอบสนอง (' + (document.getElementById('ls-step')?.innerText || '') + ')');
        }
    }, 15000);

    async function initAuth() {
        try {
            setStep('กำลังเชื่อมต่อ Firebase...');
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                setStep('กำลัง Sign In ด้วย Token...');
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                setStep('กำลัง Sign In แบบ Anonymous...');
                await signInAnonymously(auth);
            }
            setStep('Auth สำเร็จ — กำลังโหลดข้อมูล...');
        } catch (error) {
            console.error("Auth error:", error);
            setLoadingError('Auth ล้มเหลว: ' + (error.code || error.message || 'unknown'));
        }
    }

    initAuth();

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
            setStep('Authenticated — กำลังโหลด Firestore...');
            const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'store_inventory', 'state');
            onSnapshot(stateRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    products = data.products || [];
                    historyLogs = data.historyLogs || [];
                    parcelLogs = data.parcelLogs || [];
                    cart = cart.filter(item => products.some(p => p.id === item.productId));
                    saveCartLocal();
                } else {
                    setStep('ไม่พบข้อมูล — กำลังสร้างใหม่...');
                    products = [];
                    saveData();
                }
                hideLoadingScreen();
                updateCartBadge();
                render();
            }, (error) => {
                console.error("Firestore error:", error);
                setLoadingError('Firestore Error: ' + (error.code || error.message || 'permission denied'));
            });
        } else {
            setStep('ไม่พบ User — รอ Auth...');
        }
    });

    let saveTimeout = null;
    window.debouncedSaveData = function() {
        showSaveIndicator();
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            saveData(false);
        }, 1000);
    }

    async function saveData(showSuccess = true) {
        if (!currentUser) return;
        try {
            const stateRef = doc(db, 'artifacts', appId, 'public', 'data', 'store_inventory', 'state');
            await setDoc(stateRef, {
                products: products,
                historyLogs: historyLogs.slice(0, 500),
                parcelLogs: parcelLogs
            });
            hideSaveIndicator();
            if (showSuccess) window.showToast('บันทึกข้อมูลเรียบร้อย', 'success');
        } catch (e) {
            console.error("Error saving data:", e);
            hideSaveIndicator();
            window.showToast('บันทึกข้อมูลล้มเหลว!', 'error');
        }
    }

    function saveCartLocal() {
        localStorage.setItem('flash_pos_cart', JSON.stringify(cart));
        localStorage.setItem('flash_pos_discount', cartDiscount.toString());
        localStorage.setItem('flash_pos_shipping', cartShipping.toString());
        localStorage.setItem('flash_pos_note', window.cartNote || '');
        updateCartBadge();
    }

    function updateCartBadge() {
        const badge = document.getElementById('cart-badge');
        const count = cart.reduce((s, i) => s + i.qty, 0);
        if (badge) {
            if (count > 0) { badge.innerText = count; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }
        }
    }

    function addHistory(type, title, detail, changes, extraData = {}) {
        historyLogs.unshift({
            id: Date.now(),
            type, title, detail, changes,
            ...extraData,
            timestamp: new Date().toISOString(),
            undone: false
        });
        saveData(false);
    }

    window.navigate = function(tab) {
        currentTab = tab;
        window.currentSearchQuery = '';
        if (tab !== 'manage') isQuickEditMode = false; 

        document.querySelectorAll('.nav-item').forEach(el => {
            if (el.dataset.tab === tab) {
                if (el.classList.contains('desktop-nav')) {
                    el.classList.add('bg-flash-50', 'text-flash-600');
                    el.classList.remove('text-gray-600');
                } else {
                    el.classList.add('text-flash-600');
                    el.classList.remove('text-gray-500');
                }
            } else {
                if (el.classList.contains('desktop-nav')) {
                    el.classList.remove('bg-flash-50', 'text-flash-600');
                    el.classList.add('text-gray-600');
                } else {
                    el.classList.remove('text-flash-600');
                    el.classList.add('text-gray-500');
                }
            }
        });

        const titles = {
            'stock': '📦 สต็อกสินค้า',

            'parcels': '🚚 ยอดพัสดุรับเข้า',

    window.setFilter = function(cat) { currentFilter = cat; render(); }
    window.setHistorySubTab = function(tab) { window.historySubTab = tab; render(); }

    window.setQuickDate = function(mode) {
        const today = new Date();
        if (mode === 'today') {
            window.reportStartDate = getLocalYMD(today);
            window.reportEndDate = getLocalYMD(today);
        } else if (mode === 'yesterday') {
            const y = new Date(today); y.setDate(y.getDate() - 1);
            window.reportStartDate = getLocalYMD(y);
            window.reportEndDate = getLocalYMD(y);
        } else if (mode === 'week') {
            const w = new Date(today); w.setDate(w.getDate() - 6);
            window.reportStartDate = getLocalYMD(w);
            window.reportEndDate = getLocalYMD(today);
        } else if (mode === 'month') {
            window.reportStartDate = `${today.getFullYear()}-${(today.getMonth()+1).toString().padStart(2,'0')}-01`;
            window.reportEndDate = getLocalYMD(today);
        }
        render();
    }

    window.setReportDate = function(field, val) {
        if (field === 'start') window.reportStartDate = val;
        if (field === 'end') window.reportEndDate = val;
        render();
    }

    function renderFilterTabs() {
        const tabs = ['ทั้งหมด', ...categoryList];
        let html = `<div class="flex gap-2 overflow-x-auto pb-2 mb-3 scrollbar-hide px-1">`;
        tabs.forEach(cat => {
            const isActive = currentFilter === cat;
            const styleClasses = isActive ? 'bg-gray-800 text-white border-gray-800 shadow-md' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50 hover:border-gray-300';
            html += `<button onclick="window.setFilter('${cat}')" class="whitespace-nowrap px-5 py-2 rounded-xl text-sm font-bold transition-all border ${styleClasses}">${cat}</button>`;

    function renderSearchBar(placeholder = 'ค้นหาชื่อสินค้า...') {
        let clearBtn = '';
        if (window.currentSearchQuery) {
            clearBtn = `<button onclick="window.currentSearchQuery=''; this.closest('.mb-5').querySelector('#globalSearchBar').value=''; window.handleSearch('')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors"><i class="ph ph-x text-base"></i></button>`;
        }
        
        return `
        <div class="mb-5 px-1">
            <div class="relative group">
                <i class="ph ph-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-xl group-focus-within:text-flash-500 transition-colors"></i>
                <input type="text" id="globalSearchBar" value="${window.currentSearchQuery}" onkeyup="window.currentSearchQuery = this.value; window.handleSearch(this.value)" placeholder="${placeholder}" class="w-full pl-12 pr-10 py-3.5 border border-gray-200 rounded-xl focus:outline-none focus:border-flash-500 focus:ring-2 focus:ring-flash-500/20 shadow-sm text-base bg-white transition-all">
                ${clearBtn}

    window.handleSearch = function(query) {
        const q = query.toLowerCase().trim();
        document.querySelectorAll('.product-item').forEach(item => {
            const name = item.getAttribute('data-name') || '';
            item.style.display = name.includes(q) ? '' : 'none';
        });
        const noResult = document.getElementById('no-search-result');
        if (noResult) {
            const visible = [...document.querySelectorAll('.product-item')].some(el => el.style.display !== 'none');
            noResult.style.display = visible ? 'none' : '';
        }
    }

    function getFilteredProducts() {
        if (currentFilter === 'ทั้งหมด') return products;
        return products.filter(p => p.cat === currentFilter || (!categoryList.includes(p.cat) && currentFilter === 'อื่นๆ'));
    }

    window.render = function() {
        const activeElement = document.activeElement;
        let focusInfo = null;
        if (activeElement && activeElement.tagName === 'INPUT') {
            if (activeElement.id === 'globalSearchBar') focusInfo = { type: 'search' };
            else if (activeElement.dataset.pid) focusInfo = { type: 'product', pid: activeElement.dataset.pid, field: activeElement.dataset.field };
            else if (activeElement.id && activeElement.id.startsWith('pc_')) focusInfo = { type: 'parcelInput', id: activeElement.id };
        }

        const app = document.getElementById('app-content');
        app.innerHTML = '';

        if (currentTab === 'stock') renderStock(app);
        else if (currentTab === 'sell') renderSell(app);
        else if (currentTab === 'transfer') renderTransfer(app);
        else if (currentTab === 'parcels') renderParcels(app);
        else if (currentTab === 'history') renderHistory(app);
        else if (currentTab === 'manage') renderManage(app);

        if (window.currentSearchQuery && currentTab !== 'history' && currentTab !== 'parcels') window.handleSearch(window.currentSearchQuery);

        if (focusInfo) {
            setTimeout(() => {
                if (focusInfo.type === 'search') {
                    const el = document.getElementById('globalSearchBar');
                    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
                } else if (focusInfo.type === 'product') {
                    const el = document.querySelector(`input[data-pid="${focusInfo.pid}"][data-field="${focusInfo.field}"]`);
                    if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
                } else if (focusInfo.type === 'parcelInput') {
                    const el = document.getElementById(focusInfo.id);
                    if (el) { el.focus(); }
                }
            }, 10);
        }
    }

    function getStatusBadge(qty, min) {
        if (qty <= 0) return `<span class="bg-red-50 text-red-600 px-2 py-0.5 rounded border border-red-100 text-[10px] font-bold">🔴 หมด</span>`;
        if (qty <= min) return `<span class="bg-amber-50 text-amber-600 px-2 py-0.5 rounded border border-amber-100 text-[10px] font-bold">🟡 ใกล้หมด</span>`;
        return `<span class="bg-green-50 text-green-600 px-2 py-0.5 rounded border border-green-100 text-[10px] font-bold">🟢 ปกติ</span>`;
    }

    function getCatIcon(cat) {
        if (cat === 'กล่อง') return 'ph-package';
        if (cat === 'ซอง') return 'ph-envelope-simple';
        if (cat === 'บับเบิ้ล') return 'ph-circles-three-plus';
        if (cat === 'เทป') return 'ph-scissors';
        return 'ph-tag';
    }

    window.getUnitPrice = function(product, currentQty) {
        let currentPrice = product.price || 0;
        if (product.wholesale && product.wholesale.length > 0) {
            const validWholesales = product.wholesale.filter(w => w.qty > 0 && w.price >= 0);
            const sortedTiers = [...validWholesales].sort((a, b) => b.qty - a.qty);
            for (let tier of sortedTiers) {
                if (currentQty >= tier.qty) {
                    currentPrice = tier.price;
                    break;
                }
            }
        }
        return currentPrice;
    }

    window.printStockReport = function() {
        if (products.length === 0) {
            window.showToast('ไม่มีรายการสินค้าในระบบ', 'warning');
            return;
        }

        const totalQty = products.reduce((acc, p) => acc + p.warehouse + p.store, 0);

        // จัดกลุ่มสินค้าตาม 3 โซนหลัก
        const outOfStockItems = [];
        const lowStockItems = [];
        const normalStockItems = [];

        products.forEach(p => {
            const min = p.min || 0;
            // โซนของหมด: คลัง หรือ หน้าร้าน อย่างใดอย่างหนึ่งเป็น 0
            if (p.warehouse <= 0 || p.store <= 0) {
                outOfStockItems.push(p);
            } 
            // โซนใกล้หมด: คลัง หรือ หน้าร้าน น้อยกว่าหรือเท่ากับจุดแจ้งเตือน
            else if (p.warehouse <= min || p.store <= min) {
                lowStockItems.push(p);
            }

            else {
                normalStockItems.push(p);
            }
        });

    window.addToCartOption = function(pId, optionIdx) {
        window.recentlySoldIds = window.recentlySoldIds.filter(id => id !== pId);
        window.recentlySoldIds.unshift(pId);
        if (window.recentlySoldIds.length > 8) window.recentlySoldIds = window.recentlySoldIds.slice(0, 8);
        localStorage.setItem('flash_recent_sold', JSON.stringify(window.recentlySoldIds));
        
        const p = products.find(x => x.id === pId);
        if (!p) return;
        const itemsPerPack = optionIdx === -1 ? 1 : p.wholesale[optionIdx].qty;
        const totalDeductedSoFar = cart.filter(c => c.productId === pId).reduce((sum, c) => {
            const cPackQty = c.optionIdx === -1 ? 1 : p.wholesale[c.optionIdx].qty;
            return sum + (c.qty * cPackQty);
        }, 0);
        if (totalDeductedSoFar + itemsPerPack > p.store) {
            window.showToast(`สต็อกไม่พอ (ขาด ${totalDeductedSoFar + itemsPerPack - p.store} ${p.unit})`, 'error');
            return;
        }
        const existingCartItem = cart.find(c => c.productId === pId && c.optionIdx === optionIdx);
        if (existingCartItem) { existingCartItem.qty += 1; }
        else { cart.push({ cartId: Date.now().toString(), productId: pId, optionIdx, qty: 1 }); }
        window.showToast('เพิ่ม ' + p.name + ' ✓', 'success', { duration: 1500 });
        saveCartLocal();
        window.hideModal();
        render();
    }

    window.removeFromCart = function(cartId) {
        cart = cart.filter(c => c.cartId !== cartId);
        if (cart.length === 0) {
            cartDiscount = 0;
            cartShipping = 0;
        }
        saveCartLocal();
        if (cart.length === 0) window.hideModal();
        else window.openCartModal();
        render();
    }

    window.updateCartQty = function(cartId, delta) {
        const itemIndex = cart.findIndex(c => c.cartId === cartId);
        if (itemIndex === -1) return;
        const cItem = cart[itemIndex];
        const p = products.find(x => x.id === cItem.productId);
        const itemsPerPack = cItem.optionIdx === -1 ? 1 : p.wholesale[cItem.optionIdx].qty;
        const newQty = cItem.qty + delta;
        if (newQty <= 0) { window.removeFromCart(cartId); return; }
        const otherItemsDeducted = cart.filter(c => c.productId === p.id && c.cartId !== cartId).reduce((sum, c) => {
            const cPackQty = c.optionIdx === -1 ? 1 : p.wholesale[c.optionIdx].qty;
            return sum + (c.qty * cPackQty);
        }, 0);
        if (otherItemsDeducted + (newQty * itemsPerPack) > p.store) {
            window.showToast('สต็อกหน้าร้านหมดแล้ว', 'warning');
            return;
        }
        cart[itemIndex].qty = newQty;
        saveCartLocal();
        window.openCartModal();
        render();
    }

    window.setCartQtyDirect = function(cartId, val) {
        let newQty = parseInt(val);
        if (isNaN(newQty)) return;
        const itemIndex = cart.findIndex(c => c.cartId === cartId);
        if (itemIndex === -1) return;
        const cItem = cart[itemIndex];
        const p = products.find(x => x.id === cItem.productId);
        const itemsPerPack = cItem.optionIdx === -1 ? 1 : p.wholesale[cItem.optionIdx].qty;
        if (newQty <= 0) { window.removeFromCart(cartId); return; }
        const otherItemsDeducted = cart.filter(c => c.productId === p.id && c.cartId !== cartId).reduce((sum, c) => {
            const cPackQty = c.optionIdx === -1 ? 1 : p.wholesale[c.optionIdx].qty;
            return sum + (c.qty * cPackQty);
        }, 0);
        const availablePacks = Math.floor((p.store - otherItemsDeducted) / itemsPerPack);
        if (newQty > availablePacks) {
            window.showToast(`หน้าร้านเหลือจัดได้แค่ ${availablePacks} ชุด`, 'warning');
            cart[itemIndex].qty = availablePacks;
            if (availablePacks <= 0) { window.removeFromCart(cartId); return; }
        } else { cart[itemIndex].qty = newQty; }
        saveCartLocal();
        window.openCartModal();
        render();
    }

    window.setCartDiscount = function(val) {
        cartDiscount = parseFloat(val) || 0;
        if (cartDiscount < 0) cartDiscount = 0;
        saveCartLocal();

        render();

    window.setCartShipping = function(val) {

    window.printPreviewOnly = function() {
        if (cart.length === 0) return;
        let subTotal = 0;
        let changesArr = [];
        cart.forEach(item => {
            const p = products.find(x => x.id === item.productId);
            if (p) {
                const isPack = item.optionIdx !== -1;
                const packQty = isPack ? p.wholesale[item.optionIdx].qty : 1;
                const packPrice = isPack ? p.wholesale[item.optionIdx].price : (p.price || 0);
                subTotal += packPrice * item.qty;
                changesArr.push({
                    name: isPack ? `${p.name} (แพ็ค ${packQty})` : p.name,
                    cartQty: item.qty,
                    total: packPrice * item.qty
                });
            }
        });
        const finalTotal = Math.max(0, subTotal + cartShipping - cartDiscount);
        const html = generateReceiptHTMLFromData(changesArr, subTotal, finalTotal, cartDiscount, cartShipping, window.cartPaymentMethod, new Date().toISOString(), true, window.cartNote || '');
        const pa = document.getElementById('print-area');
        pa.className = 'receipt-mode';
        pa.innerHTML = html;
        window.print();
    }

    window.checkoutConfirm = function() {
        if (cart.length === 0) return;
        let _preSubTotal = 0;
        cart.forEach(item => {
            const _p = products.find(x => x.id === item.productId);
            if (_p) {
                const _pp = item.optionIdx === -1 ? (_p.price || 0) : _p.wholesale[item.optionIdx].price;
                _preSubTotal += _pp * item.qty;
            }
        });
        const _preTotal = Math.max(0, _preSubTotal + cartShipping - cartDiscount);
        const _payLabel = window.cartPaymentMethod === 'transfer' ? '💳 เงินโอน' : '💵 เงินสด';
        window.showConfirm('ยืนยันชำระเงิน', 'ยอดสุทธิ <span class="font-black text-2xl text-gray-900">฿' + window.formatMoney(_preTotal) + '</span><br><span class="text-xs text-gray-500 mt-1 inline-block">' + _payLabel + ' · ' + cart.length + ' รายการ</span>', 'success', () => {
            executeCheckout();
        });
    }

    function executeCheckout() {
        let subTotal = 0;
        let totalCost = 0;
        let changesArr = [];

        cart.forEach(item => {
            const p = products.find(x => x.id === item.productId);
            if (p) {
                const isPack = item.optionIdx !== -1;
                const packQty = isPack ? p.wholesale[item.optionIdx].qty : 1;
                const packPrice = isPack ? p.wholesale[item.optionIdx].price : (p.price || 0);
                const deductAmount = packQty * item.qty;
                const itemTotal = packPrice * item.qty;
                const itemCostTotal = (p.cost || 0) * deductAmount;
                subTotal += itemTotal;
                totalCost += itemCostTotal;
                p.store -= deductAmount;
                const displayName = isPack ? `${p.name} (แพ็ค ${packQty})` : p.name;
                changesArr.push({
                    productId: p.id,
                    name: displayName,
                    wDiff: 0,
                    sDiff: -deductAmount,
                    cartQty: item.qty,
                    unitPrice: packPrice,
                    costTotal: itemCostTotal,
                    total: itemTotal
                });
            }
        });

        const finalTotal = Math.max(0, subTotal + cartShipping - cartDiscount);
        const profit = finalTotal - totalCost; 
        const paymentMethod = window.cartPaymentMethod || 'cash';
        
        const currentReceiptHtml = generateReceiptHTMLFromData(changesArr, subTotal, finalTotal, cartDiscount, cartShipping, paymentMethod, new Date().toISOString(), false, window.cartNote || '');
        
        let extras = [];
        if(cartShipping > 0) extras.push(`ค่าส่ง ฿${window.formatMoney(cartShipping)}`);
        if(cartDiscount > 0) extras.push(`ลด ฿${window.formatMoney(cartDiscount)}`);
        extras.push(paymentMethod === 'transfer' ? 'เงินโอน' : 'เงินสด');
        const extraText = extras.length > 0 ? ` (${extras.join(', ')})` : '';

        const summaryText = `ขายสินค้า ${cart.length} รายการ รับสุทธิ ฿${window.formatMoney(finalTotal)}${extraText}`;

        historyLogs.unshift({
            id: Date.now(),
            type: 'sell',
            title: 'ขายสินค้า (POS)',
            detail: summaryText,
            changes: changesArr,
            revenue: finalTotal,
            discount: cartDiscount,
            shipping: cartShipping,
            cost: totalCost,
            profit,
            paymentMethod: paymentMethod,
            note: window.cartNote || '',
            timestamp: new Date().toISOString(),
            undone: false
        });
        saveData(false);

        window.hideModal();
        cart = [];
        cartDiscount = 0;
        cartShipping = 0;
        window.cartNote = '';
        window.cartPaymentMethod = 'cash'; 
        saveCartLocal();
        render();
        
        const _receiptHtml = currentReceiptHtml;
        window.showToast('ชำระเงินเรียบร้อย ✓', 'success', {
            actionLabel: '🖨️ พิมพ์บิล',
            duration: 8000,
            actionFn: function() {
                const pa = document.getElementById('print-area');
                pa.className = 'receipt-mode';
                pa.innerHTML = _receiptHtml;
                setTimeout(function() { window.print(); }, 200);
            }
        });
    }

    window.addToTransferCart = function(pId, type) {
        const p = products.find(x => x.id === pId);
        if (!p) return;
        
        if (type === 'out') {
            const currentQty = transferCart.filter(c => c.productId === pId && c.type === 'out').reduce((s, c) => s + c.qty, 0);
            if (currentQty + 1 > p.warehouse) {
                window.showToast('สต็อกคลัง มีไม่พอให้เบิก', 'warning');
                return;
            }
        }
        
        const existingItem = transferCart.find(c => c.productId === pId && c.type === type);
        if (existingItem) {
            existingItem.qty += 1;
        } else {
            transferCart.push({ cartId: Date.now().toString(), productId: pId, type: type, qty: 1 });
        }
        
        window.showToast(type === 'in' ? 'เลือกรับเข้าคลังแล้ว' : 'เลือกเบิกลงร้านแล้ว', 'success', { duration: 1500 });
        window.hideModal();
        render();
    }

    window.updateTransferCartQty = function(cartId, delta) {
        const itemIndex = transferCart.findIndex(c => c.cartId === cartId);
        if (itemIndex === -1) return;
        const cItem = transferCart[itemIndex];
        const p = products.find(x => x.id === cItem.productId);
        
        const newQty = cItem.qty + delta;
        if (newQty <= 0) {
            window.removeFromTransferCart(cartId);
            return;
        }
        
        if (cItem.type === 'out' && newQty > p.warehouse) {
            window.showToast(`สต็อกคลัง มีให้เบิกแค่ ${window.formatQty(p.warehouse)} ชิ้น`, 'warning');
            return;
        }
        
        transferCart[itemIndex].qty = newQty;
        window.openTransferCartModal();
        render();
    }

    window.setTransferCartQtyDirect = function(cartId, val) {
        let newQty = parseInt(val);
        if (isNaN(newQty)) return;
        const itemIndex = transferCart.findIndex(c => c.cartId === cartId);
        if (itemIndex === -1) return;
        const cItem = transferCart[itemIndex];
        const p = products.find(x => x.id === cItem.productId);
        
        if (newQty <= 0) {
            window.removeFromTransferCart(cartId);
            return;
        }
        
        if (cItem.type === 'out' && newQty > p.warehouse) {
            window.showToast(`สต็อกคลัง มีให้เบิกแค่ ${window.formatQty(p.warehouse)} ชิ้น`, 'warning');
            transferCart[itemIndex].qty = p.warehouse;
            if (p.warehouse <= 0) { window.removeFromTransferCart(cartId); return; }
        } else {
            transferCart[itemIndex].qty = newQty;
        }
        
        window.openTransferCartModal();
        render();
    }

    window.removeFromTransferCart = function(cartId) {
        transferCart = transferCart.filter(c => c.cartId !== cartId);
        if (transferCart.length === 0) window.hideModal();
        else window.openTransferCartModal();
        render();
    }

    window.submitBulkTransfer = function() {
        const note = document.getElementById('bulkTransferNote').value || 'โอนย้ายหลายรายการ';
        let changesArr = [];
        let hasError = false;
        
        transferCart.forEach(item => {
            const p = products.find(x => x.id === item.productId);
            if (p) {
                if (item.type === 'in') {
                    p.warehouse += item.qty;
                    changesArr.push({ productId: p.id, name: p.name, wDiff: item.qty, sDiff: 0 });
                } else if (item.type === 'out') {
                    if (p.warehouse >= item.qty) {
                        p.warehouse -= item.qty;
                        p.store += item.qty;
                        changesArr.push({ productId: p.id, name: p.name, wDiff: -item.qty, sDiff: item.qty });
                    } else {
                        hasError = true;
                        window.showToast(`สต็อก ${p.name} ในคลังไม่พอให้เบิก!`, 'error');
                    }
                }
            }
        });
        
        if (hasError) return;
        
        const detailStr = `ทำรายการทั้งหมด ${transferCart.length} รายการ | ${note}`;
        addHistory('transfer', 'โอนย้ายสต็อก', detailStr, changesArr);
        transferCart = [];
        window.hideModal();
        window.showToast('บันทึกการโอนย้ายเรียบร้อย ✓', 'success');
        render();
    }

    window.changeParcelDate = function(dateStr) {
        if (!dateStr) return;
        window.parcelInputDate = dateStr;
        window.parcelMonthFilter = dateStr.substring(0, 7);
        render();
        const appContent = document.getElementById('app-content');
        if (appContent) { appContent.scrollTo({ top: 0, behavior: 'smooth' }); }
    }

    window.changeParcelMonth = function(monthStr) {
        if (!monthStr) return;
        window.parcelMonthFilter = monthStr;
        render();
    }

    window.saveParcelLog = function() {
        const date = window.parcelInputDate;
        if (!date) return window.showToast('กรุณาระบุวันที่', 'error');

        const logEntry = { date: date };
        let total = 0;
        
        couriersList.forEach(c => {
            const val = parseInt(document.getElementById(`pc_${c.id}`).value) || 0;
            logEntry[c.id] = val;
            total += val;
        });
        logEntry.total = total;

        const existingIndex = parcelLogs.findIndex(l => l.date === date);
        if (existingIndex > -1) {
            parcelLogs[existingIndex] = logEntry;
        } else {
            parcelLogs.push(logEntry);
        }

        saveData(false);
        window.showToast('บันทึกยอดพัสดุเรียบร้อย', 'success');
        render();
    }

    window.deleteParcelLog = function(dateStr) {
        window.showConfirm('ยืนยันการลบ', `ต้องการลบประวัติยอดพัสดุของวันที่ <span class="font-bold text-red-500">${dateStr.split('-').reverse().join('/')}</span> ใช่หรือไม่?`, 'danger', () => {
            parcelLogs = parcelLogs.filter(l => l.date !== dateStr);
            saveData(false);
            window.showToast('ลบประวัติเรียบร้อย', 'success');
            if (window.parcelInputDate === dateStr) {
                window.parcelInputDate = getLocalYMD(new Date());
            }
            render();
        });
    }

    window.printParcelReport = function() {
        const monthFilter = window.parcelMonthFilter;
        const filteredLogs = parcelLogs.filter(log => log.date.startsWith(monthFilter));

        if (filteredLogs.length === 0) {
            window.showToast('ไม่มีประวัติการบันทึกพัสดุในเดือนที่เลือก', 'warning');
            return;
        }

        let monthlyTotals = { kerry: 0, flash: 0, post: 0, shopee: 0, lazada: 0, lazflash: 0, total: 0 };
        filteredLogs.forEach(log => {
            monthlyTotals.kerry += log.kerry || 0;
            monthlyTotals.flash += log.flash || 0;
            monthlyTotals.post += log.post || 0;
            monthlyTotals.shopee += log.shopee || 0;
            monthlyTotals.lazada += log.lazada || 0;
            monthlyTotals.lazflash += log.lazflash || 0;
            monthlyTotals.total += log.total || 0;
        });

        const sortedLogs = [...filteredLogs].sort((a, b) => new Date(a.date) - new Date(b.date));

        const [year, month] = monthFilter.split('-');

                    ` : ''}

            </div>
        `;

        if (isReport) {
            const sales = historyLogs.filter(h => h.type === 'sell' && !h.undone && new Date(h.timestamp) >= start && new Date(h.timestamp) <= end);

            let totalRev = 0, totalCost = 0, totalItems = 0, totalDiscount = 0, totalShipping = 0;
            let totalCash = 0, totalTransfer = 0; 
            const itemStats = {};
            const catStats = {};

            sales.forEach(sale => {
                const rev = (sale.revenue || 0);
                totalRev += rev;
                totalCost += (sale.cost || 0);
                totalDiscount += (sale.discount || 0);
                totalShipping += (sale.shipping || 0);
                
                if (sale.paymentMethod === 'transfer') totalTransfer += rev;
                else totalCash += rev;

                if (sale.changes) {
                    sale.changes.forEach(c => {
                        const qty = Math.abs(c.sDiff || 0);
                        const pFallback = products.find(x => x.id === c.productId);
                        const itemRev = c.total !== undefined ? c.total : (qty * (pFallback ? (pFallback.price || 0) : 0));
                        const cst = c.costTotal !== undefined ? c.costTotal : (qty * (pFallback ? (pFallback.cost || 0) : 0));
                        const name = c.name || (pFallback ? pFallback.name : 'สินค้า (ลบไปแล้ว)');
                        const cat = pFallback ? pFallback.cat : 'อื่นๆ';
                        totalItems += qty;

                        if (!catStats[cat]) catStats[cat] = { qty: 0, revenue: 0, profit: 0 };
                        catStats[cat].qty += qty;
                        catStats[cat].revenue += itemRev;
                        catStats[cat].profit += (itemRev - cst);

                        if (!itemStats[c.productId]) {
                            itemStats[c.productId] = { 
                                name: (pFallback ? pFallback.name : name), 
                                cat, 
                                qty: 0, revenue: 0, profit: 0,
                                cashQty: 0, cashRevenue: 0,
                                transferQty: 0, transferRevenue: 0
                            };
                        }
                        itemStats[c.productId].qty += qty;
                        itemStats[c.productId].revenue += itemRev;
                        itemStats[c.productId].profit += (itemRev - cst);

                        if (sale.paymentMethod === 'transfer') {
                            itemStats[c.productId].transferQty += qty;
                            itemStats[c.productId].transferRevenue += itemRev;
                        } else {
                            itemStats[c.productId].cashQty += qty;
                            itemStats[c.productId].cashRevenue += itemRev;
                        }
                    });
                }
            });
            const netProfit = totalRev - totalCost;
            const margin = totalRev > 0 ? ((netProfit / totalRev) * 100).toFixed(1) : 0;

            const sortedCatStats = Object.keys(catStats).map(k => ({ cat: k, ...catStats[k] })).sort((a, b) => b.revenue - a.revenue);
            const sortedItemStats = Object.values(itemStats).sort((a, b) => b.revenue - a.revenue);

            html += `
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 mb-5">

                    </div>
                    <div class="bg-green-50 border border-green-200 p-3 md:p-4 rounded-2xl flex flex-col justify-center min-w-0">

                        <span class="text-xl md:text-2xl font-black text-green-700 truncate" title="฿${window.formatMoney(netProfit)}">฿${window.formatMoney(netProfit)}</span>
                    </div>
                    <div class="bg-indigo-50 border border-indigo-200 p-3 md:p-4 rounded-2xl flex flex-col justify-center min-w-0">
                        <span class="text-indigo-700 text-[11px] md:text-xs font-bold mb-1 truncate">ขายได้ (ชิ้น)</span>
                        <span class="text-xl md:text-2xl font-black text-indigo-700 truncate" title="${window.formatQty(totalItems)}">${window.formatQty(totalItems)}</span>
                    </div>
                    <div class="bg-red-50 border border-red-200 p-3 md:p-4 rounded-2xl flex flex-col justify-center min-w-0">
                        <span class="text-red-700 text-[11px] md:text-xs font-bold mb-1 truncate">ส่วนลดรวม</span>
                        <span class="text-xl md:text-2xl font-black text-red-700 truncate" title="฿${window.formatMoney(totalDiscount)}">฿${window.formatMoney(totalDiscount)}</span>
                    </div>
                </div>`;

            if (sortedItemStats.length === 0) {
                html += `<div class="text-center py-16 bg-white rounded-2xl border border-dashed border-gray-200 text-gray-400"><i class="ph ph-receipt text-5xl mb-3 text-gray-300"></i><p class="font-bold">ไม่มียอดขายในช่วงวันที่เลือก</p></div>`;
            } else {
                html += `
                <h3 class="font-black text-gray-800 mb-3 px-1 flex items-center gap-2">
                    <i class="ph ph-chart-pie-slice text-flash-500 text-xl"></i> ยอดขายรายหมวดหมู่

                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">`;
                sortedCatStats.forEach(s => {
                    html += `
                    <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex flex-col hover:border-flash-300 transition-colors">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-8 h-8 rounded-xl bg-gray-100 flex items-center justify-center text-gray-600">
                                <i class="ph ${getCatIcon(s.cat)} text-lg"></i>

                html += `

        } else {

            if (!window.historyTypeFilter) window.historyTypeFilter = 'all';
            const typeFilterMap = {
                'all': 'ทั้งหมด',

                'add': 'รับเข้า/ปรับ',

            html += `
                <div class="flex gap-2 mb-3 flex-wrap">
                    ${Object.entries(typeFilterMap).map(([k,v]) => {
                        const activeClass = window.historyTypeFilter === k ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-400';

                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pb-4">`;

            const filteredHistoryLogs = window.historyTypeFilter === 'all' 
                ? historyLogs.filter(h => { const d = new Date(h.timestamp); return d >= start && d <= end; })

                    ? historyLogs.filter(h => (h.type === 'add' || h.type === 'adjust' || h.type === 'edit' || h.type === 'delete') && new Date(h.timestamp) >= start && new Date(h.timestamp) <= end)
                    : historyLogs.filter(h => h.type === window.historyTypeFilter && new Date(h.timestamp) >= start && new Date(h.timestamp) <= end);

            if (historyLogs.length === 0) {
                html += `<div class="col-span-full text-center py-16 bg-white rounded-2xl border border-dashed border-gray-200 text-gray-400"><i class="ph ph-clock-counter-clockwise text-5xl mb-3 text-gray-300"></i><p class="font-bold">ยังไม่มีประวัติการทำรายการ</p></div>`;

                        adjust: 'border-l-4 border-amber-400 bg-amber-50/40',
                        edit: 'border-l-4 border-purple-400 bg-purple-50/30',

    window.printSalesReport = function() {
        const start = new Date(window.reportStartDate); start.setHours(0, 0, 0, 0);
        const end = new Date(window.reportEndDate); end.setHours(23, 59, 59, 999);
        const sales = historyLogs.filter(h => h.type === 'sell' && !h.undone && new Date(h.timestamp) >= start && new Date(h.timestamp) <= end);

        if (sales.length === 0) {
            window.showToast('ไม่มีรายการยอดขายในช่วงวันที่เลือก', 'warning');
            return;
        }

        let totalRev = 0, totalCost = 0, totalItems = 0, totalDiscount = 0, totalShipping = 0;
        let totalCash = 0, totalTransfer = 0;
        const itemStats = {};

        sales.forEach(sale => {
            const rev = (sale.revenue || 0);
            totalRev += rev;
            totalCost += (sale.cost || 0);
            totalDiscount += (sale.discount || 0);
            totalShipping += (sale.shipping || 0);
            
            if (sale.paymentMethod === 'transfer') totalTransfer += rev;
            else totalCash += rev;

            if (sale.changes) {
                sale.changes.forEach(c => {
                    const qty = Math.abs(c.sDiff || 0);
                    const pFallback = products.find(x => x.id === c.productId);
                    const itemRev = c.total !== undefined ? c.total : (qty * (pFallback ? (pFallback.price || 0) : 0));
                    const cst = c.costTotal !== undefined ? c.costTotal : (qty * (pFallback ? (pFallback.cost || 0) : 0));
                    const name = c.name || (pFallback ? pFallback.name : 'สินค้า (ลบไปแล้ว)');
                    const cat = pFallback ? pFallback.cat : 'อื่นๆ';
                    totalItems += qty;

                    if (!itemStats[c.productId]) {
                        itemStats[c.productId] = { 
                            name: (pFallback ? pFallback.name : name), 
                            cat, 
                            qty: 0, revenue: 0, profit: 0,
                            cashQty: 0, cashRevenue: 0,
                            transferQty: 0, transferRevenue: 0
                        };
                    }
                    itemStats[c.productId].qty += qty;
                    itemStats[c.productId].revenue += itemRev;
                    itemStats[c.productId].profit += (itemRev - cst);

                    if (sale.paymentMethod === 'transfer') {
                        itemStats[c.productId].transferQty += qty;
                        itemStats[c.productId].transferRevenue += itemRev;
                    } else {
                        itemStats[c.productId].cashQty += qty;
                        itemStats[c.productId].cashRevenue += itemRev;
                    }
                });
            }
        });

        const netProfit = totalRev - totalCost;
        const sortedItemStats = Object.values(itemStats).sort((a, b) => b.revenue - a.revenue);

        // Date formatting for the report header
        const formatReportDate = (dateObj) => {
            return dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
        };
        const periodStr = start.toDateString() === end.toDateString() 
            ? formatReportDate(start) 
            : `${formatReportDate(start)} - ${formatReportDate(end)}`;

        let reportRowsHtml = sortedItemStats.map((s, idx) => `
            <tr style="border-bottom: 1px solid #e5e7eb;">
                <td style="padding: 10px 8px; text-align: center; color: #6b7280;">${idx + 1}</td>
                <td style="padding: 10px 8px; font-weight: bold;">${s.name}</td>
                <td style="padding: 10px 8px; text-align: center;">${s.cat}</td>
                <td style="padding: 10px 8px; text-align: center; font-weight: bold;">${window.formatQty(s.qty)}</td>
                <td style="padding: 10px 8px; text-align: right; color: #059669;">${window.formatMoney(s.cashRevenue)}</td>
                <td style="padding: 10px 8px; text-align: right; color: #2563eb;">${window.formatMoney(s.transferRevenue)}</td>
                <td style="padding: 10px 8px; text-align: right; font-weight: bold;">${window.formatMoney(s.revenue)}</td>
                <td style="padding: 10px 8px; text-align: right; color: #059669;">${window.formatMoney(s.profit)}</td>
            </tr>
        `).join('');

        let reportHtml = `
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="font-size: 26px; margin: 0; font-weight: bold; color: #111827;">Flash Home (สวนหลวง 14)</h2>
                <h3 style="font-size: 20px; margin: 10px 0; color: #4b5563;">รายงานสรุปยอดขายสินค้า</h3>
                <p style="font-size: 14px; margin: 0; color: #6b7280;">ประจำวันที่: ${periodStr}</p>
            </div>

            <div style="display: flex; justify-content: space-between; background: #f9fafb; padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #e5e7eb;">
                <div style="flex: 1;">
                    <p style="margin: 0 0 8px 0; font-size: 14px; color: #4b5563;">ยอดขายสุทธิรวม (รวมค่าส่ง)</p>
                    <p style="margin: 0; font-size: 28px; font-weight: bold; color: #111827;">฿${window.formatMoney(totalRev)}</p>
                    <div style="margin-top: 10px; font-size: 13px; display: flex; gap: 15px;">
                        <span style="color: #059669;">เงินสด: <b>฿${window.formatMoney(totalCash)}</b></span>
                        <span style="color: #2563eb;">เงินโอน: <b>฿${window.formatMoney(totalTransfer)}</b></span>
                    </div>
                </div>
                <div style="flex: 1; text-align: right; border-left: 2px dashed #e5e7eb; padding-left: 20px;">
                    <p style="margin: 0 0 8px 0; font-size: 14px; color: #4b5563;">กำไรขั้นต้น / จำนวนชิ้นรวม</p>
                    <p style="margin: 0; font-size: 24px; font-weight: bold; color: #059669;">+฿${window.formatMoney(netProfit)}</p>
                    <p style="margin: 8px 0 0 0; font-size: 14px; font-weight: bold; color: #4b5563;">${window.formatQty(totalItems)} ชิ้น</p>
                </div>
            </div>

            <h4 style="font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #111827; padding-bottom: 5px;">รายละเอียดการขายรายสินค้า</h4>
            <table style="width: 100%; border-collapse: collapse; font-size: 13px; text-align: left;">
                <thead>
                    <tr style="background: #f3f4f6; border-top: 1px solid #d1d5db; border-bottom: 1px solid #d1d5db;">
                        <th style="padding: 10px 8px; width: 40px; text-align: center;">ลำดับ</th>
                        <th style="padding: 10px 8px;">รายการสินค้า</th>

                        <th style="padding: 10px 8px; text-align: center;">จำนวน<br>(ชิ้น)</th>
                        <th style="padding: 10px 8px; text-align: right;">เงินสด<br>(฿)</th>
                        <th style="padding: 10px 8px; text-align: right;">เงินโอน<br>(฿)</th>
                        <th style="padding: 10px 8px; text-align: right;">รวมทั้งหมด<br>(฿)</th>

                    </tr>
                </thead>
                <tbody>
                    ${reportRowsHtml}
                </tbody>
            </table>
            <div style="margin-top: 30px; text-align: right; font-size: 12px; color: #9ca3af;">
                เอกสารออกเมื่อ: ${new Date().toLocaleString('th-TH')}
            </div>
        `;

        const pa = document.getElementById('print-area');
        pa.className = 'report-mode';
        pa.innerHTML = reportHtml;
        
        setTimeout(() => window.print(), 300);
    }

    window.undoAction = function(histId) {
        window.showConfirm('ยืนยันยกเลิกรายการ', 'ต้องการยกเลิกรายการนี้และดึงสต็อกกลับคืนใช่หรือไม่?', 'warning', () => {
            const histItem = historyLogs.find(h => h.id === histId);
            if (!histItem || histItem.undone || !histItem.changes) return;
            const changesArray = Array.isArray(histItem.changes) ? histItem.changes : [histItem.changes];
            changesArray.forEach(c => {
                const p = products.find(prod => prod.id === c.productId);
                if (p) {
                    p.warehouse -= (c.wDiff || 0);
                    p.store -= (c.sDiff || 0);
                    if (p.warehouse < 0) p.warehouse = 0;
                    if (p.store < 0) p.store = 0;
                }
            });
            histItem.undone = true;
            saveData(false);
            window.showToast('ยกเลิกรายการเรียบร้อย', 'success');
            render();
        });
    }

    let draggedId = null;
    window.dragStart = function(e, id) {
        draggedId = id;
        e.dataTransfer.effectAllowed = "move";
        setTimeout(() => e.target.classList.add('opacity-40'), 0);
    }
    window.dragOver = function(e) {
        e.preventDefault();
        const item = e.target.closest('.draggable-item');
        if (item) item.classList.add('drag-over');
    }
    window.dragLeave = function(e) {
        const item = e.target.closest('.draggable-item');
        if (item) item.classList.remove('drag-over');
    }
    window.drop = function(e, targetId) {
        e.preventDefault();
        const item = e.target.closest('.draggable-item');
        if (item) item.classList.remove('drag-over');
        if (draggedId && draggedId !== targetId) {
            const fromIndex = products.findIndex(x => x.id === draggedId);
            const toIndex = products.findIndex(x => x.id === targetId);
            if (fromIndex > -1 && toIndex > -1) {
                const [movedItem] = products.splice(fromIndex, 1);
                products.splice(toIndex, 0, movedItem);
                saveData();
                render();
            }
        }
    }
    window.dragEnd = function(e) { e.target.classList.remove('opacity-40'); }

    window.handleTableKeydown = function(e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const currentInput = e.target;
        const currentTr = currentInput.closest('tr');
        if (!currentTr) return;
        const tbody = currentTr.parentElement;
        const rows = Array.from(tbody.querySelectorAll('tr'));
        const currentRowIdx = rows.indexOf(currentTr);
        const nextRowIdx = e.shiftKey ? currentRowIdx - 1 : currentRowIdx + 1;
        if (nextRowIdx >= 0 && nextRowIdx < rows.length) {
            const currentTd = currentInput.closest('td');
            const tds = Array.from(currentTr.children);
            const colIdx = tds.indexOf(currentTd);
            const targetTd = rows[nextRowIdx].children[colIdx];
            if (targetTd) {
                const targetInput = targetTd.querySelector('input');
                if (targetInput) {
                    targetInput.focus();
                    targetInput.select();
                    targetInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }
    }

    window.quickUpdate = function(pId, field, value) {
        const p = products.find(x => x.id === pId);
        if (!p) return;
        if (field === 'name' || field === 'cat' || field === 'unit') p[field] = value.trim();
        else {
            p[field] = parseFloat(value) || 0;
            if (p[field] < 0) p[field] = 0;
        }
        window.debouncedSaveData();
    }

    window.quickUpdateWholesale = function(pId, index, field, value) {
        const p = products.find(x => x.id === pId);
        if (!p) return;
        if (!p.wholesale) p.wholesale = [];
        while (p.wholesale.length <= index) { p.wholesale.push({ qty: '', price: '' }); }
        let parsedVal = parseFloat(value);
        p.wholesale[index][field] = isNaN(parsedVal) ? '' : parsedVal;
        window.debouncedSaveData();
    }

    window.submitAdjust = function(pId) {
        const p = products.find(x => x.id === pId);
        const newW = parseInt(document.getElementById('adjW').value) || 0;
        const newS = parseInt(document.getElementById('adjS').value) || 0;
        const note = document.getElementById('adjNote').value || 'ปรับเลขสต็อกด้วยตัวเอง';
        const wDiff = newW - p.warehouse;
        const sDiff = newS - p.store;
        if (wDiff === 0 && sDiff === 0) { window.hideModal(); return; }
        p.warehouse = newW;
        p.store = newS;
        addHistory('adjust', `ปรับสต็อก ${p.name}`, `${note} | คลัง: ${newW}, ร้าน: ${newS}`, [{ productId: p.id, wDiff, sDiff }]);
        window.showToast('ปรับสต็อกเรียบร้อย', 'success');
        window.hideModal();
    }

    window.submitProduct = function(pId) {
        const name = document.getElementById('pName').value.trim();
        if (!name) { window.showToast('กรุณาใส่ชื่อสินค้า', 'error'); return; }
        const cat = document.getElementById('pCat').value;
        const unit = document.getElementById('pUnit').value || 'ชิ้น';
        const min = parseInt(document.getElementById('pMin').value) || 0;
        const price = parseFloat(document.getElementById('pPrice').value) || 0;
        const cost = parseFloat(document.getElementById('pCost').value) || 0;
        const wholesale = [];
        for (let i = 1; i <= 3; i++) {
            const q = parseInt(document.getElementById(`wQty${i}`).value);
            const pVal = parseFloat(document.getElementById(`wPrice${i}`).value);
            if (q > 0 && pVal >= 0) wholesale.push({ qty: q, price: pVal });
        }
        if (pId) {
            const p = products.find(x => x.id === pId);
            p.name = name; p.cat = cat; p.unit = unit; p.min = min; p.price = price; p.cost = cost; p.wholesale = wholesale;
            addHistory('edit', `แก้ไขรายละเอียด`, `แก้ข้อมูลและราคา ${name}`, null);
            window.showToast('บันทึกการแก้ไขแล้ว', 'success');
        } else {
            const warehouse = parseInt(document.getElementById('pWInit').value) || 0;
            const store = parseInt(document.getElementById('pSInit').value) || 0;
            const newId = Date.now();
            products.push({ id: newId, name, cat, unit, min, warehouse, store, price, cost, wholesale });
            addHistory('add', `เพิ่มสินค้าใหม่`, `เพิ่ม ${name} (คลัง:${warehouse}, ร้าน:${store})`, [{ productId: newId, wDiff: warehouse, sDiff: store }]);
            window.showToast('เพิ่มสินค้าใหม่แล้ว', 'success');
        }
        window.hideModal();
    }

    window.deleteProduct = function(pId) {
        const p = products.find(x => x.id === pId);
        window.showConfirm('ยืนยันการลบ', `ต้องการลบ "<span class="font-bold">${p.name}</span>" อย่างถาวรหรือไม่?`, 'danger', () => {
            products = products.filter(x => x.id !== pId);
            cart = cart.filter(c => c.productId !== pId);
            addHistory('delete', `ลบสินค้า`, `ลบ ${p.name} ออกจากระบบ`, null);
            window.showToast('ลบสินค้าเรียบร้อย', 'success');
            window.hideModal();
            render();
        });
    }

</script>
</body>
